<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snakes &amp; Ladders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bw:min(92vw,54vh,470px);--gold:#f5c26b;--ink:#f4ead6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#2b3a5c 0%,#141a2b 55%,#0b0e18 100%) fixed;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 8px 24px;overflow-x:hidden}
h1{margin:2px 0 0;font:800 24px Cinzel,Georgia,serif;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(180deg,#ffe9b0,#e0a43f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 12px #e0a43f33}
#players{display:flex;gap:10px;width:var(--bw)}
.pl{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff14;transition:.3s;opacity:.6}
.pl.act{opacity:1;background:#ffffff1c;border-color:var(--gold);box-shadow:0 0 18px #f5c26b40}
.pl i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -2px 4px #0006,0 0 0 2px #fff8}
.pl b{display:block;font-size:14px;line-height:1.1}.pl small{font-size:12px;opacity:.7}
#status{min-height:22px;font-size:16px;font-weight:800;color:var(--gold);text-align:center;padding:0 10px}
#bd{position:relative;width:var(--bw);height:var(--bw);border:10px solid #5b3a20;border-radius:18px;box-sizing:content-box;box-shadow:0 0 0 2px #d9a85f,0 0 0 5px #3a2312,0 24px 50px #000c,inset 0 0 18px #0008;margin-bottom:30px;background:#3a2312}
#grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));border-radius:7px;overflow:hidden}
.c{position:relative;min-width:0;min-height:0;font-size:calc(var(--bw)/38);font-weight:800;padding:3px 4px;box-sizing:border-box;color:#7a5a36aa}
.c.l{background:linear-gradient(135deg,#f6e9cb,#efddb4)}.c.d{background:linear-gradient(135deg,#e2c690,#d8b97d)}
.c.fin{background:radial-gradient(circle,#ffe9a0,#f0b84a);color:#6b4310}
#art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tk{position:absolute;width:6.4%;height:6.4%;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid #fff;box-shadow:0 4px 6px #000a,inset 0 -4px 6px #0006;transition:left .16s linear,top .16s linear;z-index:2}
.tk::after{content:"";position:absolute;left:20%;top:13%;width:38%;height:30%;border-radius:50%;background:radial-gradient(#fffe,#fff0 72%)}
#t0{background:radial-gradient(circle at 40% 35%,#ff9d94,#e53935 55%,#8e1b17)}
#t1{background:radial-gradient(circle at 40% 35%,#9bd0ff,#1e88e5 55%,#0d3f7a)}
#pl0 i{background:#e53935}#pl1 i{background:#1e88e5}
#ctl{display:flex;gap:14px;align-items:center;justify-content:center}
#die{width:64px;height:64px;border-radius:16px;background:linear-gradient(145deg,#fffdf6,#e3d5b6);box-shadow:0 6px 14px #000a,inset 0 -3px 5px #0002,inset 0 2px 3px #fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;gap:2px}
#die span{border-radius:50%;margin:auto;width:11px;height:11px;background:radial-gradient(circle at 35% 30%,#4a3b36,#120d0b);opacity:0}
#die span.on{opacity:1}
#die.roll{animation:tumble .55s ease-in-out}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-26px) rotate(140deg) scale(1.12)}55%{transform:translateY(0) rotate(300deg) scale(.95)}75%{transform:translateY(-8px) rotate(350deg)}100%{transform:translateY(0) rotate(360deg)}}
button{font:800 15px Nunito,system-ui,sans-serif;color:var(--ink);background:#ffffff14;border:1px solid #ffffff26;border-radius:999px;padding:11px 18px;cursor:pointer;transition:.2s}
button:active{transform:scale(.96)}
#roll{font-size:17px;padding:13px 28px;color:#2a1704;background:linear-gradient(180deg,#ffd98a,#e8a43a);border:none;box-shadow:0 6px 16px #e8a43a55,inset 0 1px 0 #fff9;letter-spacing:.04em}
button:disabled{opacity:.4;box-shadow:none;cursor:default}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<h1>Snakes &amp; Ladders</h1>
<div id="players">
 <div class="pl" id="pl0"><i></i><div><b>You</b><small id="n0">Start</small></div></div>
 <div class="pl" id="pl1"><i></i><div><b>Engine</b><small id="n1">Start</small></div></div>
</div>
<div id="status"></div>
<div id="bd"><div id="grid"></div><svg id="art" viewBox="0 0 100 100"></svg><div class="tk" id="t0"></div><div class="tk" id="t1"></div></div>
<div id="ctl"><div id="die"></div><button id="roll">Roll the dice</button><button id="new">New game</button></div>
<script>
const SN={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78},LD={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const J=Object.assign({},SN,LD),$=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let pos=[0,0],turn=0,busy=false,over=false,tk=[$('t0'),$('t1')];
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
$('die').innerHTML='<span></span>'.repeat(9);
function setDie(d){[...$('die').children].forEach((s,i)=>s.classList.toggle('on',PIPS[d].includes(i)))}
function xy(n){if(n<1)return[5,108];const i=n-1,r=i/10|0,c=r%2?9-i%10:i%10;return[c*10+5,(9-r)*10+5]}
function build(){
 let h='';for(let vr=0;vr<10;vr++)for(let vc=0;vc<10;vc++){const r=9-vr,n=r*10+(r%2?9-vc:vc)+1;
  h+=`<div class="c ${n==100?'fin':(r+vc)%2?'d':'l'}">${n==100?'★ 100':n}</div>`}
 $('grid').innerHTML=h;
 let s='';
 const lad=(a,b,col,w,tx,ty,rung)=>{const[x1,y1]=xy(+a),[x2,y2]=xy(b),L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,nx=-uy*1.4,ny=ux*1.4;
  let g=`<g stroke="${col}" stroke-linecap="round" transform="translate(${tx} ${ty})"><line stroke-width="${w}" x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}"/><line stroke-width="${w}" x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}"/>`;
  if(rung)for(let d=3;d<L-1;d+=3.4)g+=`<line stroke-width=".8" x1="${x1+ux*d+nx}" y1="${y1+uy*d+ny}" x2="${x1+ux*d-nx}" y2="${y1+uy*d-ny}"/>`;
  return g+'</g>'};
 for(const[a,b]of Object.entries(LD))s+=lad(a,b,'#0004',1.2,.5,.8,1)+lad(a,b,'#b97b3c',1.1,0,0,0)+lad(a,b,'#e9bd7e',.8,0,0,1)+lad(a,b,'#f7dcaa',.3,-.15,-.15,0);
 const cols=['#2e9e63','#d2493a','#7b5cd0','#e0a020','#1f9bb0'];let k=0;
 for(const[a,b]of Object.entries(SN)){const[x1,y1]=xy(+a),[x2,y2]=xy(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*6,ny=dx/L*6,c=cols[k++%5];
  const c1x=x1+dx*.33+nx,c1y=y1+dy*.33+ny,d=`M${x1} ${y1} C${c1x} ${c1y} ${x1+dx*.66-nx} ${y1+dy*.66-ny} ${x2} ${y2}`,ang=Math.atan2(y1-c1y,x1-c1x)*180/Math.PI;
  s+=`<path d="${d}" fill="none" stroke="#0004" stroke-width="2.6" stroke-linecap="round" transform="translate(.5 .8)"/>
  <path d="${d}" fill="none" stroke="${c}" stroke-width="2.3" stroke-linecap="round"/>
  <path d="${d}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1" stroke-linecap="round" stroke-dasharray=".1 2.4"/>
  <path d="${d}" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width=".4" stroke-linecap="round" transform="translate(-.5 -.5)"/>
  <g transform="translate(${x1} ${y1}) rotate(${ang})"><ellipse rx="2.9" ry="2.3" fill="${c}"/><ellipse rx="2.9" ry="2.3" fill="none" stroke="#0003" stroke-width=".3"/>
  <circle cx="1" cy="-1.1" r=".7" fill="#fff"/><circle cx="1" cy="1.1" r=".7" fill="#fff"/><circle cx="1.2" cy="-1.1" r=".35" fill="#111"/><circle cx="1.2" cy="1.1" r=".35" fill="#111"/>
  <path d="M2.8 0H4.6M4.6 0l.9-.7M4.6 0l.9.7" stroke="#ff4d5e" stroke-width=".3" fill="none" stroke-linecap="round"/></g>`}
 $('art').innerHTML=s}
function place(p,n,ms){const[x,y]=xy(n),o=p?1.9:-1.9,t=tk[p];if(ms!=null)t.style.transition=`left ${ms}ms ease,top ${ms}ms ease`;t.style.left=(x+o)+'%';t.style.top=y+'%';$('n'+p).textContent=n?'Square '+n:'Start'}
const say=t=>$('status').textContent=t;
function ui(){$('roll').disabled=busy||over||turn!==0;[0,1].forEach(p=>$('pl'+p).classList.toggle('act',!over&&turn===p))}
function confetti(){const c=['#ffd98a','#ff6f61','#6ec6ff','#8be28b','#c9a0ff'];for(let i=0;i<60;i++){const e=document.createElement('div');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
async function doTurn(p){
 busy=true;ui();const who=p?'Engine':'You';
 $('die').classList.add('roll');
 let d=1;for(let i=0;i<8;i++){d=1+Math.random()*6|0;setDie(d);await sleep(70)}
 $('die').classList.remove('roll');
 say(`${who} rolled a ${d}`);await sleep(350);
 const from=pos[p],to=from+d;
 if(to>100)say(`${who} rolled ${d} — needs an exact roll to reach 100`);
 else{for(let n=from+1;n<=to;n++){place(p,n,160);pos[p]=n;await sleep(170)}
  if(J[to]){const up=LD[to];say(up?`🪜 ${who} climbs a ladder to ${J[to]}!`:`🐍 ${who} slides down a snake to ${J[to]}`);await sleep(450);place(p,J[to],650);pos[p]=J[to];await sleep(700)}}
 if(pos[p]===100){over=true;busy=false;say(p?'Engine wins! Better luck next time.':'🎉 You win!');if(!p)confetti();ui();return}
 const again=d===6&&to<=100;
 await sleep(300);
 if(again){say(`${who} rolled a 6 — roll again!`);turn=p}else turn=1-p;
 busy=false;ui();
 if(turn===1){say(again?'Engine rolls again…':'Engine’s turn…');await sleep(600);doTurn(1)}
 else say(again?'6! Roll again.':'Your turn — roll the dice');
}
function reset(){pos=[0,0];turn=0;busy=false;over=false;setDie(5);[0,1].forEach(p=>{tk[p].style.transition='none';place(p,0)});
 void tk[0].offsetWidth;tk.forEach(t=>t.style.transition='');say('Your turn — roll the dice');ui()}
$('roll').onclick=()=>{if(!busy&&!over&&turn===0)doTurn(0)};
$('new').onclick=()=>{if(busy)return;reset()};
build();reset();
</script>
</body>
</html>
